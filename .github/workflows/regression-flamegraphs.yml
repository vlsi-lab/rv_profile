name: Regression flamegraphs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flamegraph:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [cv32e20, cv32e40p, cv32e40px, cv32e40x]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl binutils

      - name: Install rv_profile
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate flamegraph for ${{ matrix.core }}
        run: |
          rv_profile \
            --elf ${{ matrix.core }}/main.elf \
            --fst ${{ matrix.core }}/waves.fst \
            --cfg ${{ matrix.core }}/config.wal \
            --out flamegraph_${{ matrix.core }}.svg

      - name: Sanity-check flamegraph
        env:
          SVG: flamegraph_${{ matrix.core }}.svg
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          path = pathlib.Path(os.environ["SVG"])
          if not path.exists():
              sys.exit(f"missing: {path}")
          if path.stat().st_size == 0:
              sys.exit(f"empty: {path}")
          data = path.read_text(errors="replace")
          if "<svg" not in data:
              sys.exit("output is not an SVG")
          rects = len(re.findall(r"<rect\b", data))
          if rects < 10:
              sys.exit(f"flamegraph only has {rects} rects — looks empty")
          print(f"ok: {rects} rects in {path}")
          PY

      - name: Upload flamegraph
        uses: actions/upload-artifact@v4
        with:
          name: flamegraph-${{ matrix.core }}
          path: flamegraph_${{ matrix.core }}.svg
          if-no-files-found: error

  publish:
    needs: flamegraph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all flamegraphs
        uses: actions/download-artifact@v4
        with:
          path: flamegraphs
          pattern: flamegraph-*
          merge-multiple: true

      - name: Build site
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_TIME: ${{ github.run_started_at }}
        run: |
          mkdir site
          cp flamegraphs/*.svg site/
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<title>rv_profile regression flamegraphs</title>'
            echo '<style>'
            echo '  body { font-family: sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }'
            echo '  h1 { font-size: 1.6rem; }'
            echo '  h2 { font-size: 1.1rem; margin-top: 2rem; }'
            echo '  iframe { width: 100%; height: 620px; border: 1px solid #ccc; }'
            echo '  code { background: #f4f4f4; padding: 0 .25rem; }'
            echo '</style></head><body>'
            echo "<h1>rv_profile regression flamegraphs</h1>"
            echo "<p>Built from <code>${COMMIT_SHA}</code> at ${RUN_TIME}.</p>"
            for svg in site/flamegraph_*.svg; do
              name=$(basename "$svg" .svg)
              core=${name#flamegraph_}
              echo "<h2>${core}</h2>"
              echo "<iframe src=\"$(basename "$svg")\"></iframe>"
            done
            echo '</body></html>'
          } > site/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
